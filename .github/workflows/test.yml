name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # wie das Image (Dockerfile: python:3.13-slim)
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src pytest -q
